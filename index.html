<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fffaf4">
    <title>桃桃的日记本</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #fffaf4;
            --surface: #fffefb;
            --surface-warm: #fff4ef;
            --fg: #4a4140;
            --muted: #817675;
            --border: #eadfd8;
            --pink: #d88986;
            --pink-soft: #f7deda;
            --shadow: 0 12px 32px rgba(126, 95, 82, 0.10);
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --bg: #292525;
            --surface: #332f2e;
            --surface-warm: #3b3432;
            --fg: #eee7e2;
            --muted: #bbb0aa;
            --border: #514947;
            --pink: #e2a39f;
            --pink-soft: #59403e;
            --shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            padding: 32px 20px 20px;
            background:
                radial-gradient(circle at 10% 12%, rgba(247, 222, 218, 0.65), transparent 22rem),
                var(--bg);
            color: var(--fg);
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            line-height: 1.75;
        }

        [data-theme="dark"] body {
            background:
                radial-gradient(circle at 10% 12%, rgba(107, 78, 76, 0.30), transparent 22rem),
                var(--bg);
        }

        button, input, select { font: inherit; }
        button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
            outline: 2px solid var(--pink);
            outline-offset: 3px;
        }

        .container { max-width: 56rem; margin: 0 auto; }

        .header-card,
        .screen-container,
        .tools-card {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .header-card { margin-bottom: 18px; }

        .header-bar,
        .entry-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
        }

        .header-left,
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .paw-mark {
            display: grid;
            width: 32px;
            height: 32px;
            place-items: center;
            border-radius: 50%;
            background: var(--pink-soft);
            color: var(--pink);
            font-size: 15px;
        }

        .filename, .entry-filename { color: var(--muted); font-size: 13px; }

        .theme-button,
        .date-tab,
        .tool-control,
        .diary-nav button,
        .print-button {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--fg);
            cursor: pointer;
            font-family: inherit;
        }

        .theme-button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 15px;
        }

        .header-content {
            display: grid;
            min-height: 260px;
            grid-template-columns: 60% 40%;
            align-items: center;
        }

        .title-wrap { padding: 30px 28px; }

        .main-title {
            margin-bottom: 14px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(30px, 6vw, 44px);
            line-height: 1.2;
        }

        .subtitle { min-height: 28px; color: var(--muted); font-size: 14px; }

        .cover-wrap {
            display: grid;
            height: 100%;
            min-height: 260px;
            place-items: center;
            overflow: hidden;
            border-left: 1px solid var(--border);
            background: var(--surface-warm);
        }

        .cover-wrap img {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 260px;
            object-fit: cover;
        }

        .typing {
            border-right: 2px solid var(--pink);
            animation: blink 0.7s infinite;
        }

        @keyframes blink { 50% { border-color: transparent; } }

        .tools-card { margin-bottom: 16px; }

        .tools-heading {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-warm);
            font-size: 13px;
            font-weight: 700;
        }

        .local-notice,
        .restore-card,
        .editor-card {
            margin-bottom: 16px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .management-card { margin-bottom: 16px; }
        .local-notice,
        .restore-card { padding: 14px 16px; color: var(--muted); font-size: 13px; }
        .local-notice strong, .restore-card strong { color: var(--fg); }
        .local-notice p { margin-top: 6px; }
        .local-notice[hidden], .restore-card[hidden], .editor-form[hidden] { display: none; }
        .restore-card { border-color: var(--pink); background: var(--surface-warm); }

        .restore-actions,
        .editor-actions,
        .management-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .restore-actions { margin-top: 10px; }

        .management-actions {
            justify-content: flex-end;
            padding: 12px 16px;
        }

        .management-button,
        .restore-button,
        .editor-submit {
            min-height: 36px;
            padding: 7px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--fg);
            cursor: pointer;
            font-size: 12px;
        }

        .management-button.primary,
        .editor-submit {
            border-color: var(--pink);
            background: var(--pink);
            color: #fff;
        }

        .management-button.danger { border-color: #bf7771; color: #a64d49; }
        .management-button:disabled { opacity: 0.45; cursor: default; }

        .import-label { display: inline-flex; align-items: center; }
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            clip-path: inset(50%);
        }

        .editor-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            background: var(--surface-warm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            list-style: none;
        }

        .editor-summary::-webkit-details-marker { display: none; }
        .editor-summary::after { content: "＋"; color: var(--pink); font-size: 18px; }
        .editor-card[open] .editor-summary::after { content: "−"; }
        .editor-form { padding: 16px; }

        .editor-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .editor-field { display: grid; min-width: 0; gap: 5px; }
        .editor-field.full { grid-column: 1 / -1; }
        .editor-label { color: var(--muted); font-size: 12px; }
        .editor-control {
            width: 100%;
            min-width: 0;
            min-height: 40px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--fg);
            font: inherit;
            font-size: 13px;
        }

        textarea.editor-control { min-height: 92px; resize: vertical; }
        .editor-status { min-height: 22px; margin-top: 8px; color: var(--muted); font-size: 12px; }
        .editor-actions { justify-content: flex-end; margin-top: 10px; }

        .tools-body {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(220px, 0.7fr);
            gap: 16px;
            padding: 16px;
        }

        .tool-field { display: grid; gap: 6px; }
        .tool-label { color: var(--muted); font-size: 12px; }

        .tool-control {
            width: 100%;
            min-height: 42px;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 13px;
        }

        .filter-results {
            padding: 0 16px 16px;
        }

        .filter-summary { margin-bottom: 8px; color: var(--muted); font-size: 12px; }

        .result-list {
            display: grid;
            gap: 6px;
            max-height: 220px;
            overflow-y: auto;
            list-style: none;
        }

        .result-button {
            display: flex;
            width: 100%;
            align-items: baseline;
            gap: 12px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--fg);
            cursor: pointer;
            text-align: left;
        }

        .result-button:hover { border-color: var(--pink); }
        .result-date { flex: 0 0 auto; color: var(--pink); font-size: 12px; }
        .result-title { overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }

        .date-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            overflow-x: auto;
            padding: 4px 2px 8px;
            scrollbar-width: thin;
        }

        .date-tab {
            flex: 0 0 auto;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 12px;
            white-space: nowrap;
            transition: 0.2s ease;
        }

        .date-tab:hover { border-color: var(--pink); }
        .date-tab.active { border-color: var(--pink); background: var(--pink); color: #fff; }

        .entry-status { color: var(--pink); font-size: 12px; }
        .entry-body { padding: 22px; }
        .entry-title { margin-bottom: 12px; font-size: 18px; }
        .entry-content, .entry-note { color: var(--muted); font-size: 14px; }
        .entry-content p, .entry-note p { margin-bottom: 10px; white-space: pre-wrap; }
        .entry-content p:last-child, .entry-note p:last-child { margin-bottom: 0; }

        .quote-box {
            margin-top: 16px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--pink-soft);
            border-radius: 14px;
            background: var(--surface-warm);
        }

        .quote-title { margin-bottom: 6px; color: var(--pink); font-weight: 700; }
        .entry-image { display: block; max-width: 100%; max-height: 32rem; margin: 18px auto 0; border-radius: 14px; object-fit: contain; }
        .entry-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; list-style: none; }
        .entry-tag { padding: 3px 10px; border-radius: 999px; background: var(--pink-soft); color: var(--pink); font-size: 11px; }

        .diary-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 18px 0 0;
        }

        .diary-nav button, .print-button {
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 12px;
        }

        .diary-nav button:disabled { opacity: 0.45; cursor: default; }
        .diary-position { color: var(--muted); font-size: 12px; text-align: center; }

        .empty-state {
            padding: 36px 22px;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }

        footer { padding: 24px 12px 8px; color: var(--muted); font-size: 12px; text-align: center; }
        footer a { color: var(--pink); text-decoration: none; }

        @media (max-width: 680px) {
            body { padding: 16px 12px; }
            .header-content { grid-template-columns: 1fr; }
            .title-wrap { padding: 26px 22px; }
            .cover-wrap { height: 180px; min-height: 180px; border-top: 1px solid var(--border); border-left: 0; }
            .cover-wrap img { min-height: 180px; }
            .tools-body { grid-template-columns: 1fr; gap: 12px; }
            .management-actions { justify-content: flex-start; }
            .entry-body { padding: 18px 16px; }
        }

        @media (max-width: 420px) {
            .header-bar, .entry-bar { align-items: flex-start; }
            .entry-bar { flex-direction: column; gap: 2px; }
            .diary-nav { gap: 6px; }
            .diary-nav button { padding: 8px 10px; }
            .editor-grid { grid-template-columns: 1fr; }
            .editor-field.full { grid-column: auto; }
        }

        @media print {
            body { padding: 0; background: #fff; color: #222; }
            .header-card, .screen-container, .tools-card { box-shadow: none; }
            .date-tabs, .tools-card, .local-notice, .restore-card, .management-card, .editor-card, .diary-nav,
            .theme-button, .print-button, footer { display: none !important; }
            .header-card { margin-bottom: 12px; }
            .cover-wrap { display: none; }
            .header-content { min-height: 0; grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header-card">
            <div class="header-bar">
                <div class="header-left">
                    <span class="paw-mark" aria-hidden="true">🐾</span>
                    <span class="filename">桃桃的日记本</span>
                </div>
                <div class="header-actions">
                    <button class="print-button" id="print-button" type="button" aria-label="打印当前日记">打印</button>
                    <button class="theme-button" id="theme-button" type="button" aria-label="切换主题">🌙</button>
                </div>
            </div>
            <div class="header-content">
                <div class="title-wrap">
                    <h1 class="main-title">桃桃的日记本</h1>
                    <p class="subtitle"><span class="typing" data-text="晒太阳、吃小鱼、记录今天的好心情">晒太阳、吃小鱼、记录今天的好心情</span></p>
                </div>
                <div class="cover-wrap">
                    <img id="home-image" src="assets/taotao-home.png" alt="桃桃在温暖的家里">
                </div>
            </div>
        </header>

        <section class="tools-card" aria-labelledby="tools-heading">
            <h2 class="tools-heading" id="tools-heading">寻找一段日记</h2>
            <div class="tools-body">
                <label class="tool-field" for="diary-search">
                    <span class="tool-label">搜索日期、标题、正文、天气、心情或标签</span>
                    <input class="tool-control" id="diary-search" type="search" placeholder="输入关键词…" autocomplete="off">
                </label>
                <label class="tool-field" for="month-filter">
                    <span class="tool-label">月份归档</span>
                    <select class="tool-control" id="month-filter">
                        <option value="">所有月份</option>
                    </select>
                </label>
            </div>
            <div class="filter-results" id="filter-results" hidden aria-live="polite">
                <p class="filter-summary" id="filter-summary"></p>
                <ul class="result-list" id="result-list"></ul>
            </div>
        </section>

        <aside class="local-notice" role="status">
            <strong>本地草稿与备份：</strong>新增、编辑和删除只保存在此浏览器，不会改写仓库中的 <code>diary.json</code>，也不会跨设备同步。请定期导出 JSON 备份；要发布修改，请把导出的文件替换仓库里的 <code>diary.json</code>。
            <p id="backup-status" aria-live="polite">当前展示仓库中的 diary.json；尚无本地草稿修改。</p>
        </aside>

        <section class="restore-card" id="restore-card" hidden aria-live="polite">
            <p id="restore-message"></p>
            <div class="restore-actions">
                <button class="restore-button" id="restore-draft" type="button">恢复本地草稿</button>
                <button class="restore-button" id="discard-draft" type="button">忽略并删除草稿</button>
            </div>
        </section>

        <section class="management-card" aria-label="日记管理">
            <div class="management-actions">
                <button class="management-button primary" id="new-entry" type="button">新增日记</button>
                <button class="management-button" id="edit-entry" type="button" disabled>编辑本篇</button>
                <button class="management-button danger" id="delete-entry" type="button" disabled>删除本篇</button>
                <label class="management-button import-label" for="import-file">导入 JSON</label>
                <input class="visually-hidden" id="import-file" type="file" accept=".json,application/json">
                <button class="management-button" id="export-json" type="button">导出完整 JSON</button>
            </div>
            <details class="editor-card" id="entry-editor" hidden>
                <summary class="editor-summary" id="editor-heading">新增日记</summary>
                <form class="editor-form" id="entry-form">
                    <div class="editor-grid">
                        <label class="editor-field">
                            <span class="editor-label">日期</span>
                            <input class="editor-control" name="date" type="date" required>
                        </label>
                        <label class="editor-field">
                            <span class="editor-label">标题</span>
                            <input class="editor-control" name="title" type="text" maxlength="120" required>
                        </label>
                        <label class="editor-field">
                            <span class="editor-label">天气</span>
                            <input class="editor-control" name="weather" type="text" maxlength="40">
                        </label>
                        <label class="editor-field">
                            <span class="editor-label">心情</span>
                            <input class="editor-control" name="mood" type="text" maxlength="80">
                        </label>
                        <label class="editor-field full">
                            <span class="editor-label">正文（每段之间空一行）</span>
                            <textarea class="editor-control" name="content" rows="5"></textarea>
                        </label>
                        <label class="editor-field">
                            <span class="editor-label">小记标题</span>
                            <input class="editor-control" name="noteTitle" type="text" maxlength="60" placeholder="今日小确幸">
                        </label>
                        <label class="editor-field">
                            <span class="editor-label">标签（用逗号分隔）</span>
                            <input class="editor-control" name="tags" type="text" placeholder="晒太阳，午觉">
                        </label>
                        <label class="editor-field full">
                            <span class="editor-label">小记（可选）</span>
                            <textarea class="editor-control" name="note" rows="3"></textarea>
                        </label>
                        <label class="editor-field full">
                            <span class="editor-label">配图路径（可选，不提供上传）</span>
                            <input class="editor-control" name="image" type="text" placeholder="assets/taotao-home.png">
                        </label>
                    </div>
                    <p class="editor-status" id="editor-status" role="status" aria-live="polite"></p>
                    <div class="editor-actions">
                        <button class="management-button" id="cancel-edit" type="button">取消</button>
                        <button class="editor-submit" type="submit">保存到本地草稿</button>
                    </div>
                </form>
            </details>
        </section>

        <nav class="date-tabs" id="date-tabs" aria-label="日记日期" tabindex="0"></nav>

        <main class="screen-container" id="diary-content" aria-live="polite">
            <p class="empty-state">正在读取日记…</p>
        </main>

        <nav class="diary-nav" aria-label="翻阅日记">
            <button type="button" id="prev-diary" disabled>← 上一篇</button>
            <span class="diary-position" id="diary-position" aria-live="polite"></span>
            <button type="button" id="next-diary" disabled>下一篇 →</button>
        </nav>

        <footer>
            <p>桃桃的日常 · 记录小小幸福 <a href="about.html">关于桃桃</a></p>
        </footer>
    </div>

    <script>
        const DRAFT_KEY = 'taotao-diary-local-draft-v1';
        const diaryState = { entries: [], currentDate: null, editingDate: null };
        const dateTabs = document.getElementById('date-tabs');
        const diaryContent = document.getElementById('diary-content');
        const searchInput = document.getElementById('diary-search');
        const monthFilter = document.getElementById('month-filter');
        const resultList = document.getElementById('result-list');
        const filterSummary = document.getElementById('filter-summary');
        const entryEditor = document.getElementById('entry-editor');
        const entryForm = document.getElementById('entry-form');
        const editorStatus = document.getElementById('editor-status');
        const backupStatus = document.getElementById('backup-status');
        let pendingDraft = null;

        function readPreference(key) {
            try { return window.localStorage.getItem(key); } catch { return null; }
        }

        function savePreference(key, value) {
            try { window.localStorage.setItem(key, value); return true; } catch { return false; }
        }

        function updateThemeButton(theme) {
            document.getElementById('theme-button').textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        function setTheme(theme, persist = true) {
            const selectedTheme = theme === 'dark' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', selectedTheme);
            updateThemeButton(selectedTheme);
            if (persist) savePreference('theme', selectedTheme);
        }

        setTheme(readPreference('theme') || 'light', false);
        document.getElementById('theme-button').addEventListener('click', () => {
            setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });
        document.getElementById('print-button').addEventListener('click', () => window.print());

        function typeWriter() {
            document.querySelectorAll('.typing').forEach((element) => {
                const text = element.getAttribute('data-text');
                if (!text || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                let index = 0;
                let deleting = false;
                const play = () => {
                    if (!deleting) {
                        element.textContent = text.slice(0, ++index);
                        if (index === text.length) {
                            deleting = true;
                            window.setTimeout(play, 1800);
                        } else {
                            window.setTimeout(play, 110 + Math.random() * 45);
                        }
                    } else {
                        element.textContent = text.slice(0, --index);
                        if (index === 0) {
                            deleting = false;
                            window.setTimeout(play, 700);
                        } else {
                            window.setTimeout(play, 45);
                        }
                    }
                };
                play();
            });
        }
        typeWriter();

        function isValidDate(value) {
            if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
            const date = new Date(`${value}T00:00:00Z`);
            return !Number.isNaN(date.getTime()) && date.toISOString().slice(0, 10) === value;
        }

        function normalizeEntry(item) {
            if (!item || typeof item !== 'object' || Array.isArray(item) || !isValidDate(item.date)) return null;
            const content = Array.isArray(item.content)
                ? item.content.filter((paragraph) => typeof paragraph === 'string')
                : typeof item.content === 'string' ? [item.content] : [];
            return {
                date: item.date,
                title: typeof item.title === 'string' && item.title.trim() ? item.title.trim() : '未命名日记',
                weather: typeof item.weather === 'string' ? item.weather : '',
                mood: typeof item.mood === 'string' ? item.mood : '',
                content,
                note: typeof item.note === 'string' ? item.note : '',
                noteTitle: typeof item.noteTitle === 'string' ? item.noteTitle : '今日小确幸',
                tags: Array.isArray(item.tags) ? item.tags.filter((tag) => typeof tag === 'string' && tag.trim()) : [],
                image: typeof item.image === 'string' ? item.image.trim() : ''
            };
        }

        function sortEntries(entries) {
            return entries.sort((a, b) => a.date.localeCompare(b.date));
        }

        function formatDate(dateString) {
            const [year, month, day] = dateString.split('-').map(Number);
            const date = new Date(year, month - 1, day);
            const weekday = new Intl.DateTimeFormat('zh-CN', { weekday: 'short' }).format(date);
            return `${dateString} · ${weekday}`;
        }

        function makeElement(tag, className, text) {
            const element = document.createElement(tag);
            if (className) element.className = className;
            if (text !== undefined) element.textContent = text;
            return element;
        }

        function renderParagraphs(container, paragraphs) {
            paragraphs.forEach((text) => container.appendChild(makeElement('p', '', text)));
        }

        function renderEntry(entry) {
            diaryContent.replaceChildren();
            const article = makeElement('article', 'entry');
            const bar = makeElement('div', 'entry-bar');
            bar.appendChild(makeElement('span', 'entry-filename', `${formatDate(entry.date)}${entry.weather ? ` · ${entry.weather}` : ''}`));
            if (entry.mood) bar.appendChild(makeElement('span', 'entry-status', entry.mood));
            article.appendChild(bar);

            const body = makeElement('div', 'entry-body');
            body.appendChild(makeElement('h2', 'entry-title', entry.title));
            const content = makeElement('div', 'entry-content');
            renderParagraphs(content, entry.content);
            if (!entry.content.length) content.appendChild(makeElement('p', '', '这篇日记还没有正文。'));
            body.appendChild(content);

            if (entry.note) {
                const noteBox = makeElement('section', 'quote-box');
                noteBox.appendChild(makeElement('h3', 'quote-title', entry.noteTitle));
                const noteContent = makeElement('div', 'entry-note');
                renderParagraphs(noteContent, entry.note.split(/\n\s*\n/).filter(Boolean));
                noteBox.appendChild(noteContent);
                body.appendChild(noteBox);
            }

            if (entry.tags.length) {
                const tags = makeElement('ul', 'entry-tags');
                entry.tags.forEach((tag) => tags.appendChild(makeElement('li', 'entry-tag', tag)));
                body.appendChild(tags);
            }

            if (entry.image) {
                const image = makeElement('img', 'entry-image');
                image.src = entry.image;
                image.alt = `日记配图：${entry.title}`;
                image.addEventListener('error', () => image.remove(), { once: true });
                body.appendChild(image);
            }

            article.appendChild(body);
            diaryContent.appendChild(article);
        }

        function renderEmptyState(message) {
            diaryContent.replaceChildren(makeElement('p', 'empty-state', message));
        }

        function renderDateTabs() {
            dateTabs.replaceChildren();
            if (!diaryState.entries.length || !diaryState.currentDate) return;
            const activeIndex = diaryState.entries.findIndex((entry) => entry.date === diaryState.currentDate);
            const visibleCount = 7;
            const start = Math.max(0, Math.min(activeIndex - 3, diaryState.entries.length - visibleCount));
            diaryState.entries.slice(start, start + visibleCount).forEach((entry) => {
                const button = makeElement('button', 'date-tab', entry.date);
                button.type = 'button';
                button.classList.toggle('active', entry.date === diaryState.currentDate);
                button.setAttribute('aria-current', entry.date === diaryState.currentDate ? 'date' : 'false');
                button.addEventListener('click', () => showDate(entry.date));
                dateTabs.appendChild(button);
            });
            scrollActiveDateTab();
        }

        function scrollActiveDateTab() {
            const activeTab = dateTabs.querySelector('.date-tab.active');
            if (activeTab) {
                const containerBounds = dateTabs.getBoundingClientRect();
                const tabBounds = activeTab.getBoundingClientRect();
                dateTabs.scrollLeft += tabBounds.left - containerBounds.left - (containerBounds.width - tabBounds.width) / 2;
            }
        }

        window.addEventListener('resize', scrollActiveDateTab);

        function updateNavigation() {
            const index = diaryState.entries.findIndex((entry) => entry.date === diaryState.currentDate);
            document.getElementById('prev-diary').disabled = index <= 0;
            document.getElementById('next-diary').disabled = index < 0 || index >= diaryState.entries.length - 1;
            document.getElementById('diary-position').textContent = index < 0
                ? '' : `第 ${index + 1} 篇 / 共 ${diaryState.entries.length} 篇`;
            document.getElementById('edit-entry').disabled = index < 0;
            document.getElementById('delete-entry').disabled = index < 0;
        }

        function renderMonthOptions() {
            const selectedMonth = monthFilter.value;
            monthFilter.replaceChildren(new Option('所有月份', ''));
            const months = [...new Set(diaryState.entries.map((entry) => entry.date.slice(0, 7)))].sort().reverse();
            months.forEach((month) => {
                const [year, monthNumber] = month.split('-');
                monthFilter.add(new Option(`${year} 年 ${Number(monthNumber)} 月`, month));
            });
            if (months.includes(selectedMonth)) monthFilter.value = selectedMonth;
        }

        function updateFilterResults() {
            const query = searchInput.value.trim().toLocaleLowerCase();
            const month = monthFilter.value;
            const isFiltering = Boolean(query || month);
            const resultPanel = document.getElementById('filter-results');
            resultPanel.hidden = !isFiltering;
            if (!isFiltering) return;

            const matches = diaryState.entries.filter((entry) => {
                const matchesMonth = !month || entry.date.startsWith(month);
                const searchableText = [
                    entry.date, entry.title, entry.weather, entry.mood, entry.content.join(' '),
                    entry.note, entry.noteTitle, entry.tags.join(' ')
                ].join(' ').toLocaleLowerCase();
                return matchesMonth && (!query || searchableText.includes(query));
            }).slice().reverse();

            filterSummary.textContent = matches.length ? `找到 ${matches.length} 篇日记` : '没有找到符合条件的日记。';
            resultList.replaceChildren();
            matches.forEach((entry) => {
                const item = document.createElement('li');
                const button = makeElement('button', 'result-button');
                button.type = 'button';
                button.appendChild(makeElement('span', 'result-date', entry.date));
                button.appendChild(makeElement('span', 'result-title', entry.title));
                button.addEventListener('click', () => showDate(entry.date));
                item.appendChild(button);
                resultList.appendChild(item);
            });
        }

        function renderCollection(preferredDate) {
            sortEntries(diaryState.entries);
            renderMonthOptions();
            if (diaryState.entries.length) {
                const date = diaryState.entries.some((entry) => entry.date === preferredDate)
                    ? preferredDate : diaryState.entries[diaryState.entries.length - 1].date;
                showDate(date, false);
                const url = new URL(window.location.href);
                url.hash = date;
                window.history.replaceState({ date }, '', url);
            } else {
                diaryState.currentDate = null;
                renderEmptyState('还没有日记，可新增日记或导入完整 JSON。');
                renderDateTabs();
                updateNavigation();
                const url = new URL(window.location.href);
                url.hash = '';
                window.history.replaceState({}, '', url);
            }
            updateFilterResults();
        }

        function showDate(date, updateAddress = true) {
            if (!diaryState.entries.some((entry) => entry.date === date)) return;
            diaryState.currentDate = date;
            renderEntry(diaryState.entries.find((entry) => entry.date === date));
            renderDateTabs();
            updateNavigation();
            if (updateAddress && window.location.hash !== `#${date}`) {
                const url = new URL(window.location.href);
                url.hash = date;
                window.history.pushState({ date }, '', url);
            }
        }

        function navigateDiary(offset) {
            const index = diaryState.entries.findIndex((entry) => entry.date === diaryState.currentDate);
            const target = diaryState.entries[index + offset];
            if (target) showDate(target.date);
        }

        document.getElementById('prev-diary').addEventListener('click', () => navigateDiary(-1));
        document.getElementById('next-diary').addEventListener('click', () => navigateDiary(1));
        searchInput.addEventListener('input', updateFilterResults);
        monthFilter.addEventListener('change', updateFilterResults);

        document.addEventListener('keydown', (event) => {
            const target = event.target;
            if (event.altKey || event.ctrlKey || event.metaKey ||
                target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement ||
                target instanceof HTMLSelectElement || target.isContentEditable) return;
            if (event.key === 'ArrowLeft' && !document.getElementById('prev-diary').disabled) {
                event.preventDefault();
                navigateDiary(-1);
            }
            if (event.key === 'ArrowRight' && !document.getElementById('next-diary').disabled) {
                event.preventDefault();
                navigateDiary(1);
            }
        });

        window.addEventListener('popstate', () => {
            const date = window.location.hash.slice(1);
            if (diaryState.entries.some((entry) => entry.date === date)) showDate(date, false);
            else if (diaryState.entries.length) showDate(diaryState.entries[diaryState.entries.length - 1].date, false);
        });

        document.getElementById('home-image').addEventListener('error', (event) => {
            event.currentTarget.closest('.cover-wrap').hidden = true;
        }, { once: true });

        function showRestorePrompt(draft) {
            pendingDraft = draft;
            const card = document.getElementById('restore-card');
            const message = document.getElementById('restore-message');
            const restoreButton = document.getElementById('restore-draft');
            card.hidden = false;
            if (draft.error) {
                message.textContent = '发现无法读取的本地草稿；它不会覆盖仓库日记。可清除损坏草稿后继续。';
                restoreButton.disabled = true;
                document.getElementById('discard-draft').textContent = '清除损坏草稿';
            } else {
                const savedAt = draft.savedAt ? new Date(draft.savedAt).toLocaleString('zh-CN') : '时间未知';
                message.textContent = `发现 ${draft.entries.length} 篇本地草稿（${savedAt}）。恢复后将以草稿覆盖本次浏览器中的仓库展示；原始 diary.json 不会被修改。`;
                restoreButton.disabled = false;
                document.getElementById('discard-draft').textContent = '忽略并删除草稿';
            }
        }

        function readLocalDraft() {
            let raw;
            try { raw = window.localStorage.getItem(DRAFT_KEY); } catch { return null; }
            if (!raw) return null;
            try {
                const parsed = JSON.parse(raw);
                if (parsed.version !== 1 || !Array.isArray(parsed.entries)) return { error: true };
                const entries = parsed.entries.map(normalizeEntry);
                if (entries.some((entry) => !entry) || new Set(entries.map((entry) => entry.date)).size !== entries.length) {
                    return { error: true };
                }
                return { entries: sortEntries(entries), savedAt: parsed.savedAt || '' };
            } catch {
                return { error: true };
            }
        }

        document.getElementById('restore-draft').addEventListener('click', () => {
            if (!pendingDraft || pendingDraft.error) return;
            const previousDate = diaryState.currentDate;
            diaryState.entries = pendingDraft.entries;
            document.getElementById('restore-card').hidden = true;
            backupStatus.textContent = '已恢复本地草稿。它只保存在此浏览器中；导出 JSON 备份并替换仓库 diary.json 才能发布。';
            renderCollection(previousDate);
            pendingDraft = null;
        });

        document.getElementById('discard-draft').addEventListener('click', () => {
            try { window.localStorage.removeItem(DRAFT_KEY); } catch { /* Storage may be disabled. */ }
            document.getElementById('restore-card').hidden = true;
            backupStatus.textContent = '已忽略本地草稿，当前显示仓库中的 diary.json。';
            pendingDraft = null;
        });

        function saveDraft() {
            const payload = {
                version: 1,
                savedAt: new Date().toISOString(),
                entries: sortEntries(diaryState.entries).map((entry) => ({ ...entry, content: [...entry.content], tags: [...entry.tags] }))
            };
            try {
                window.localStorage.setItem(DRAFT_KEY, JSON.stringify(payload));
                backupStatus.textContent = `本地草稿已保存（${new Date(payload.savedAt).toLocaleString('zh-CN')}），仅此浏览器可见。请导出 JSON 备份；要发布请替换仓库 diary.json。`;
                return true;
            } catch {
                backupStatus.textContent = '浏览器无法保存本地草稿（可能是存储空间或权限不足）。请立即导出 JSON 备份。';
                return false;
            }
        }

        function setEditorStatus(message, isError = false) {
            editorStatus.textContent = message;
            editorStatus.style.color = isError ? '#a64d49' : '';
        }

        function openEditor(mode) {
            const values = entryForm.elements;
            const editing = mode === 'edit'
                ? diaryState.entries.find((entry) => entry.date === diaryState.currentDate)
                : null;
            if (mode === 'edit' && !editing) return;
            diaryState.editingDate = editing ? editing.date : null;
            entryForm.reset();
            values.namedItem('date').value = editing ? editing.date : nextAvailableDate();
            values.namedItem('title').value = editing ? editing.title : '';
            values.namedItem('weather').value = editing ? editing.weather : '';
            values.namedItem('mood').value = editing ? editing.mood : '';
            values.namedItem('content').value = editing ? editing.content.join('\n\n') : '';
            values.namedItem('noteTitle').value = editing ? editing.noteTitle : '今日小确幸';
            values.namedItem('note').value = editing ? editing.note : '';
            values.namedItem('tags').value = editing ? editing.tags.join('，') : '';
            values.namedItem('image').value = editing ? editing.image : '';
            document.getElementById('editor-heading').textContent = editing ? `编辑日记 · ${editing.date}` : '新增日记';
            setEditorStatus('');
            entryEditor.hidden = false;
            entryEditor.open = true;
            entryEditor.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function dateInputValue(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function nextAvailableDate() {
            const occupied = new Set(diaryState.entries.map((entry) => entry.date));
            const date = new Date();
            date.setHours(12, 0, 0, 0);
            while (occupied.has(dateInputValue(date))) date.setDate(date.getDate() + 1);
            return dateInputValue(date);
        }

        document.getElementById('new-entry').addEventListener('click', () => openEditor('new'));
        document.getElementById('edit-entry').addEventListener('click', () => openEditor('edit'));
        document.getElementById('cancel-edit').addEventListener('click', () => {
            entryEditor.open = false;
            setEditorStatus('');
        });

        entryForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const form = new FormData(entryForm);
            const date = String(form.get('date') || '');
            if (!isValidDate(date)) {
                setEditorStatus('请选择有效日期。', true);
                return;
            }
            const title = String(form.get('title') || '').trim();
            if (!title) {
                setEditorStatus('请填写日记标题。', true);
                return;
            }
            const conflict = diaryState.entries.find((entry) => entry.date === date && entry.date !== diaryState.editingDate);
            if (conflict) {
                setEditorStatus('这一天已有日记；请编辑原日记，或选择其他日期。', true);
                return;
            }
            const updatedEntry = normalizeEntry({
                date,
                title,
                weather: String(form.get('weather') || '').trim(),
                mood: String(form.get('mood') || '').trim(),
                content: String(form.get('content') || '').split(/\n\s*\n/).map((part) => part.trim()).filter(Boolean),
                noteTitle: String(form.get('noteTitle') || '').trim() || '今日小确幸',
                note: String(form.get('note') || '').trim(),
                tags: String(form.get('tags') || '').split(/[,，]/).map((tag) => tag.trim()).filter(Boolean),
                image: String(form.get('image') || '').trim()
            });
            const existingIndex = diaryState.entries.findIndex((entry) => entry.date === diaryState.editingDate);
            if (existingIndex >= 0) diaryState.entries.splice(existingIndex, 1, updatedEntry);
            else diaryState.entries.push(updatedEntry);
            sortEntries(diaryState.entries);
            saveDraft();
            renderCollection(date);
            diaryState.editingDate = null;
            entryEditor.open = false;
        });

        document.getElementById('delete-entry').addEventListener('click', () => {
            const index = diaryState.entries.findIndex((entry) => entry.date === diaryState.currentDate);
            if (index < 0) return;
            const entry = diaryState.entries[index];
            if (!window.confirm(`删除「${entry.date} ${entry.title}」？此操作只修改当前浏览器中的草稿。`)) return;
            diaryState.entries.splice(index, 1);
            const nextDate = diaryState.entries[Math.min(index, diaryState.entries.length - 1)]?.date || null;
            saveDraft();
            renderCollection(nextDate);
        });

        function exportJson() {
            const json = JSON.stringify(sortEntries(diaryState.entries), null, 2);
            const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'diary.json';
            document.body.appendChild(link);
            link.click();
            link.remove();
            window.setTimeout(() => URL.revokeObjectURL(url), 1000);
            backupStatus.textContent = `已导出 ${diaryState.entries.length} 篇日记的完整 JSON。请将 diary.json 下载文件备份，发布时替换仓库版本。`;
        }
        document.getElementById('export-json').addEventListener('click', exportJson);

        document.getElementById('import-file').addEventListener('change', async (event) => {
            const input = event.currentTarget;
            const file = input.files?.[0];
            if (!file) return;
            try {
                const data = JSON.parse(await file.text());
                if (!Array.isArray(data)) throw new Error('JSON 根节点必须是日记数组。');
                const entries = data.map(normalizeEntry);
                if (entries.some((entry) => !entry)) throw new Error('有日记缺少有效日期或格式不正确，未导入任何内容。');
                if (new Set(entries.map((entry) => entry.date)).size !== entries.length) {
                    throw new Error('导入数据中有重复日期，请先修正后再导入。');
                }
                if (!window.confirm(`导入将替换当前列表并保存为本地草稿（${entries.length} 篇）。原始 diary.json 不会修改。继续吗？`)) return;
                const previousDate = diaryState.currentDate;
                diaryState.entries = sortEntries(entries);
                const stored = saveDraft();
                renderCollection(previousDate);
                backupStatus.textContent = stored
                    ? 'JSON 已导入为本地草稿。请检查内容并导出备份；发布时替换仓库 diary.json。'
                    : 'JSON 已导入到当前页面，但浏览器无法保存草稿；请立即导出完整 JSON 备份。';
            } catch (error) {
                window.alert(`无法导入 JSON：${error.message}`);
            } finally {
                input.value = '';
            }
        });

        function validateStaticEntries(data) {
            const normalized = data.map(normalizeEntry).filter(Boolean);
            const uniqueEntries = new Map(normalized.map((entry) => [entry.date, entry]));
            return sortEntries([...uniqueEntries.values()]);
        }

        async function loadDiaries() {
            let staticError = false;
            try {
                const response = await fetch('./diary.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('根节点必须是日记数组');
                diaryState.entries = validateStaticEntries(data);
                if (data.length !== diaryState.entries.length) {
                    console.warn('Some invalid or duplicate diary entries were skipped.');
                }
            } catch (error) {
                staticError = true;
                diaryState.entries = [];
                console.error('Diary data could not be loaded:', error);
            }

            const firstDate = window.location.hash.slice(1);
            if (diaryState.entries.length) {
                const initialDate = diaryState.entries.some((entry) => entry.date === firstDate)
                    ? firstDate : diaryState.entries[diaryState.entries.length - 1].date;
                renderCollection(initialDate);
            } else {
                renderEmptyState(staticError
                    ? '暂时无法读取 diary.json。请确认文件存在、JSON 格式正确，并通过本地静态服务器打开本页。'
                    : '还没有日记，可新增日记或导入完整 JSON。');
                renderDateTabs();
                updateNavigation();
                renderMonthOptions();
            }

            const draft = readLocalDraft();
            if (draft) showRestorePrompt(draft);
        }

        loadDiaries();
    </script>
</body>
</html>
