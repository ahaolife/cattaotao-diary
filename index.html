<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fffaf4">
    <title>桃桃的日记本</title>
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* Storage may be disabled. */ }
        })();
    </script>
    <style>
        :root {
            color-scheme: light;
            --bg: #fffaf4;
            --surface: #fffefb;
            --surface-warm: #fff4ef;
            --fg: #4a4140;
            --muted: #817675;
            --border: #eadfd8;
            --pink: #d88986;
            --pink-soft: #f7deda;
            --shadow: 0 12px 32px rgba(126, 95, 82, 0.10);
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --bg: #292525;
            --surface: #332f2e;
            --surface-warm: #3b3432;
            --fg: #eee7e2;
            --muted: #bbb0aa;
            --border: #514947;
            --pink: #e2a39f;
            --pink-soft: #59403e;
            --shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            padding: 32px 20px 20px;
            background:
                radial-gradient(circle at 10% 12%, rgba(247, 222, 218, 0.65), transparent 22rem),
                var(--bg);
            color: var(--fg);
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            line-height: 1.75;
        }

        [data-theme="dark"] body {
            background:
                radial-gradient(circle at 10% 12%, rgba(107, 78, 76, 0.30), transparent 22rem),
                var(--bg);
        }

        button, input, select { font: inherit; }
        button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
            outline: 2px solid var(--pink);
            outline-offset: 3px;
        }

        .container { max-width: 56rem; margin: 0 auto; }

        .header-card,
        .screen-container {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .header-card { margin-bottom: 18px; }
        .screen-container { overflow: visible; }

        .header-bar,
        .entry-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
        }

        .header-left,
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .paw-mark {
            display: grid;
            width: 32px;
            height: 32px;
            place-items: center;
            border-radius: 50%;
            background: var(--pink-soft);
            color: var(--pink);
            font-size: 15px;
        }

        .filename, .entry-filename { color: var(--muted); font-size: 13px; }

        .theme-button,
        .date-tab,
        .search-toggle,
        .diary-nav button,
        .print-button {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--fg);
            cursor: pointer;
            font-family: inherit;
        }

        .theme-button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 15px;
        }

        .search-toggle {
            flex: 0 0 auto;
            min-height: 36px;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 12px;
        }

        .header-content {
            display: grid;
            min-height: 260px;
            grid-template-columns: 60% 40%;
            align-items: center;
        }

        .title-wrap { padding: 30px 28px; }

        .main-title {
            margin-bottom: 14px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(30px, 6vw, 44px);
            line-height: 1.2;
        }

        .subtitle { min-height: 28px; color: var(--muted); font-size: 14px; }

        .cover-wrap {
            display: grid;
            height: 100%;
            min-height: 260px;
            place-items: center;
            overflow: hidden;
            border-left: 1px solid var(--border);
            background: var(--surface-warm);
        }

        .cover-wrap img {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 260px;
            object-fit: cover;
        }

        .typing {
            border-right: 2px solid var(--pink);
            animation: blink 0.7s infinite;
        }

        @keyframes blink { 50% { border-color: transparent; } }

        .calendar-backdrop {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(54, 44, 42, 0.42);
        }

        .calendar-backdrop[hidden] { display: none; }

        .calendar-sheet {
            width: min(100%, 30rem);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--surface);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.24);
        }

        .calendar-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .calendar-title { font-size: 15px; font-weight: 700; }
        .calendar-actions { display: flex; align-items: center; gap: 8px; }

        .calendar-nav,
        .calendar-close {
            display: grid;
            width: 32px;
            height: 32px;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--surface);
            color: var(--fg);
            cursor: pointer;
            font-size: 14px;
        }

        .calendar-nav:hover,
        .calendar-close:hover { border-color: var(--pink); }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 6px;
        }

        .calendar-weekday {
            padding-bottom: 4px;
            color: var(--muted);
            font-size: 11px;
            text-align: center;
        }

        .calendar-day {
            display: grid;
            align-content: start;
            gap: 2px;
            min-height: 58px;
            padding: 6px 4px;
            border: 1px solid transparent;
            border-radius: 12px;
            background: var(--surface-warm);
            color: var(--fg);
            text-align: center;
        }

        .calendar-day.empty { background: transparent; }
        .calendar-day.has-entry { cursor: pointer; border-color: var(--border); }
        .calendar-day.has-entry:hover { border-color: var(--pink); }
        .calendar-day.current { border-color: var(--pink); box-shadow: inset 0 0 0 1px var(--pink); }
        .calendar-day-number { font-size: 13px; font-weight: 700; }

        .calendar-day-mood {
            display: -webkit-box;
            overflow: hidden;
            color: var(--pink);
            font-size: 10px;
            line-height: 1.2;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .calendar-hint { margin-top: 12px; color: var(--muted); font-size: 11px; text-align: center; }

        .diary-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .date-tabs {
            display: flex;
            flex: 1;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 2px 10px;
            scrollbar-width: thin;
        }

        .date-tab {
            display: grid;
            flex: 0 0 auto;
            gap: 2px;
            min-width: 96px;
            padding: 8px 12px;
            border-radius: 16px;
            text-align: left;
            transition: 0.2s ease;
        }

        .date-tab-day { font-size: 13px; font-weight: 700; white-space: nowrap; }
        .date-tab-mood { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .date-tab:hover { border-color: var(--pink); }
        .date-tab.active { border-color: #a85d5a; background: #a85d5a; color: #fff; }
        .date-tab.active .date-tab-mood { color: rgba(255, 255, 255, 0.92); }

        .entry-status { color: var(--pink); font-size: 12px; }
        .entry-body { padding: 22px; }
        .entry-content { color: var(--fg); font-size: 15px; line-height: 2; }
        .entry-content p { margin-bottom: 18px; white-space: pre-wrap; }
        .entry-content p:last-child { margin-bottom: 0; }
        .entry-image { display: block; max-width: 100%; max-height: 32rem; margin: 18px auto 0; border-radius: 14px; object-fit: contain; }
        .entry-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; list-style: none; }
        .entry-tag { padding: 3px 10px; border-radius: 999px; background: var(--pink-soft); color: var(--pink); font-size: 11px; }

        .diary-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 18px 0 0;
        }

        .diary-nav button, .print-button {
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 12px;
        }

        .diary-nav button:disabled { opacity: 0.45; cursor: default; }
        .diary-position { color: var(--muted); font-size: 12px; text-align: center; }

        .empty-state {
            padding: 36px 22px;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }

        footer { padding: 24px 12px 8px; color: var(--muted); font-size: 12px; text-align: center; }
        footer a { color: var(--pink); text-decoration: none; }

        @media (max-width: 680px) {
            body { padding: 16px 12px; }
            .header-content { grid-template-columns: 1fr; }
            .title-wrap { padding: 26px 22px; }
            .cover-wrap { height: 180px; min-height: 180px; border-top: 1px solid var(--border); border-left: 0; }
            .cover-wrap img { min-height: 180px; }
            .diary-toolbar { align-items: stretch; flex-direction: column; }
            .entry-body { padding: 18px 16px; }
            .calendar-backdrop { padding: 12px; }
            .calendar-sheet { padding: 14px; }
            .calendar-day { min-height: 52px; padding: 5px 2px; }
        }

        @media (max-width: 420px) {
            .header-bar, .entry-bar { align-items: flex-start; }
            .entry-bar { flex-direction: column; gap: 2px; }
            .diary-nav { gap: 6px; }
            .diary-nav button { padding: 8px 10px; }
        }

        @media print {
            body { padding: 0; background: #fff; color: #222; }
            .header-card, .screen-container { box-shadow: none; }
            .diary-toolbar, .calendar-backdrop, .diary-nav,
            .theme-button, .print-button, footer { display: none !important; }
            .header-card { margin-bottom: 12px; }
            .cover-wrap { display: none; }
            .header-content { min-height: 0; grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header-card">
            <div class="header-bar">
                <div class="header-left">
                    <span class="paw-mark" aria-hidden="true">🐾</span>
                    <span class="filename">桃桃的日记本</span>
                </div>
                <div class="header-actions">
                    <button class="print-button" id="print-button" type="button" aria-label="打印当前日记">打印</button>
                    <button class="theme-button" id="theme-button" type="button" aria-label="切换主题">🌙</button>
                </div>
            </div>
            <div class="header-content">
                <div class="title-wrap">
                    <h1 class="main-title">桃桃的日记本</h1>
                    <p class="subtitle"><span class="typing" data-text="晒太阳、吃小鱼、记录今天的好心情">晒太阳、吃小鱼、记录今天的好心情</span></p>
                </div>
                <div class="cover-wrap">
                    <img id="home-image" src="assets/taotao-home.png" alt="桃桃在温暖的家里">
                </div>
            </div>
        </header>

        <div class="diary-toolbar">
            <nav class="date-tabs" id="date-tabs" aria-label="日记日期"></nav>
            <button class="search-toggle" id="calendar-toggle" type="button" aria-expanded="false" aria-controls="calendar-backdrop">📅 寻找日记</button>
        </div>

        <main class="screen-container" id="diary-content">
            <p class="empty-state">正在读取日记…</p>
        </main>

        <nav class="diary-nav" aria-label="翻阅日记">
            <button type="button" id="prev-diary" disabled>← 上一篇</button>
            <span class="diary-position" id="diary-position" aria-live="polite"></span>
            <button type="button" id="next-diary" disabled>下一篇 →</button>
        </nav>

        <footer>
            <p>桃桃的日常 · 记录小小幸福 <a href="about.html">关于桃桃</a></p>
        </footer>
    </div>

    <div class="calendar-backdrop" id="calendar-backdrop" hidden>
        <section class="calendar-sheet" role="dialog" aria-modal="true" aria-labelledby="calendar-title">
            <div class="calendar-head">
                <div class="calendar-actions">
                    <button class="calendar-nav" id="calendar-prev" type="button" aria-label="上个月">‹</button>
                    <span class="calendar-title" id="calendar-title"></span>
                    <button class="calendar-nav" id="calendar-next" type="button" aria-label="下个月">›</button>
                </div>
                <button class="calendar-close" id="calendar-close" type="button" aria-label="关闭日历">×</button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
            <p class="calendar-hint">点有心情标记的日子，翻开那天的小日记。</p>
        </section>
    </div>

    <script>
        const diaryState = { entries: [], currentDate: null };
        const dateTabs = document.getElementById('date-tabs');
        const diaryContent = document.getElementById('diary-content');
        const calendarBackdrop = document.getElementById('calendar-backdrop');
        const calendarGrid = document.getElementById('calendar-grid');
        const calendarTitle = document.getElementById('calendar-title');
        const calendarToggle = document.getElementById('calendar-toggle');
        const calendarSheet = document.querySelector('.calendar-sheet');
        const pageRoot = document.querySelector('.container');
        let calendarYear = 0;
        let calendarMonth = 0;
        let lastFocusedBeforeCalendar = null;

        function savePreference(key, value) {
            try { window.localStorage.setItem(key, value); return true; } catch { return false; }
        }

        function updateThemeButton(theme) {
            document.getElementById('theme-button').textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        function setTheme(theme, persist = true) {
            const selectedTheme = theme === 'dark' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', selectedTheme);
            updateThemeButton(selectedTheme);
            if (persist) savePreference('theme', selectedTheme);
        }

        setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light', false);
        document.getElementById('theme-button').addEventListener('click', () => {
            setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });
        document.getElementById('print-button').addEventListener('click', () => window.print());

        function localToday() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${now.getFullYear()}-${month}-${day}`;
        }

        function openCalendar() {
            lastFocusedBeforeCalendar = document.activeElement;
            const base = diaryState.currentDate
                ? diaryState.currentDate
                : (diaryState.entries[diaryState.entries.length - 1]?.date || localToday());
            const [year, month] = base.split('-').map(Number);
            calendarYear = year;
            calendarMonth = month - 1;
            renderCalendar();
            calendarBackdrop.hidden = false;
            calendarToggle.setAttribute('aria-expanded', 'true');
            if ('inert' in HTMLElement.prototype) pageRoot.inert = true;
            document.getElementById('calendar-close').focus();
        }

        function closeCalendar() {
            calendarBackdrop.hidden = true;
            calendarToggle.setAttribute('aria-expanded', 'false');
            if ('inert' in HTMLElement.prototype) pageRoot.inert = false;
            const target = lastFocusedBeforeCalendar && document.contains(lastFocusedBeforeCalendar)
                ? lastFocusedBeforeCalendar : calendarToggle;
            target.focus();
            lastFocusedBeforeCalendar = null;
        }

        function trapCalendarFocus(event) {
            if (calendarBackdrop.hidden || event.key !== 'Tab') return;
            const focusables = Array.from(calendarSheet.querySelectorAll('button, [role="button"][tabindex="0"]'))
                .filter((element) => !element.disabled);
            if (!focusables.length) return;
            const first = focusables[0];
            const last = focusables[focusables.length - 1];
            if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first.focus();
            }
        }

        function renderCalendar() {
            calendarTitle.textContent = `${calendarYear} 年 ${calendarMonth + 1} 月`;
            calendarGrid.replaceChildren();
            ['日', '一', '二', '三', '四', '五', '六'].forEach((label) => {
                calendarGrid.appendChild(makeElement('div', 'calendar-weekday', label));
            });

            const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
            const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
            const entriesByDate = new Map(diaryState.entries.map((entry) => [entry.date, entry]));

            for (let i = 0; i < firstDay; i += 1) {
                calendarGrid.appendChild(makeElement('div', 'calendar-day empty'));
            }

            for (let day = 1; day <= daysInMonth; day += 1) {
                const date = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const entry = entriesByDate.get(date);
                const cell = makeElement('div', 'calendar-day');
                cell.appendChild(makeElement('span', 'calendar-day-number', String(day)));
                if (entry) {
                    cell.classList.add('has-entry');
                    cell.appendChild(makeElement('span', 'calendar-day-mood', entry.mood || entry.title));
                    cell.title = `${date} · ${entry.title}`;
                    cell.setAttribute('aria-label', `${date}，${entry.title}，心情${entry.mood || '未记录'}`);
                    if (date === diaryState.currentDate) cell.classList.add('current');
                    cell.tabIndex = 0;
                    cell.setAttribute('role', 'button');
                    const jump = () => {
                        closeCalendar();
                        showDate(date);
                    };
                    cell.addEventListener('click', jump);
                    cell.addEventListener('keydown', (event) => {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            jump();
                        }
                    });
                }
                calendarGrid.appendChild(cell);
            }
        }

        calendarToggle.addEventListener('click', openCalendar);
        document.getElementById('calendar-close').addEventListener('click', closeCalendar);
        document.getElementById('calendar-prev').addEventListener('click', () => {
            calendarMonth -= 1;
            if (calendarMonth < 0) { calendarMonth = 11; calendarYear -= 1; }
            renderCalendar();
        });
        document.getElementById('calendar-next').addEventListener('click', () => {
            calendarMonth += 1;
            if (calendarMonth > 11) { calendarMonth = 0; calendarYear += 1; }
            renderCalendar();
        });
        calendarBackdrop.addEventListener('click', (event) => {
            if (event.target === calendarBackdrop) closeCalendar();
        });

        function typeWriter() {
            document.querySelectorAll('.typing').forEach((element) => {
                const text = element.getAttribute('data-text');
                if (!text || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                let index = 0;
                let deleting = false;
                const play = () => {
                    if (!deleting) {
                        element.textContent = text.slice(0, ++index);
                        if (index === text.length) {
                            deleting = true;
                            window.setTimeout(play, 1800);
                        } else {
                            window.setTimeout(play, 110 + Math.random() * 45);
                        }
                    } else {
                        element.textContent = text.slice(0, --index);
                        if (index === 0) {
                            deleting = false;
                            window.setTimeout(play, 700);
                        } else {
                            window.setTimeout(play, 45);
                        }
                    }
                };
                play();
            });
        }
        typeWriter();

        function isValidDate(value) {
            if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
            const date = new Date(`${value}T00:00:00Z`);
            return !Number.isNaN(date.getTime()) && date.toISOString().slice(0, 10) === value;
        }

        function safeImagePath(value) {
            if (typeof value !== 'string') return '';
            const path = value.trim();
            if (/^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(path)) return '';
            return path;
        }

        function normalizeEntry(item) {
            if (!item || typeof item !== 'object' || Array.isArray(item) || !isValidDate(item.date)) return null;
            const content = Array.isArray(item.content)
                ? item.content.filter((paragraph) => typeof paragraph === 'string')
                : typeof item.content === 'string' ? [item.content] : [];
            return {
                date: item.date,
                title: typeof item.title === 'string' && item.title.trim() ? item.title.trim() : '未命名日记',
                weather: typeof item.weather === 'string' ? item.weather : '',
                mood: typeof item.mood === 'string' ? item.mood : '',
                content,
                note: typeof item.note === 'string' ? item.note : '',
                tags: Array.isArray(item.tags) ? item.tags.filter((tag) => typeof tag === 'string' && tag.trim()) : [],
                image: safeImagePath(item.image)
            };
        }

        function sortEntries(entries) {
            return entries.sort((a, b) => a.date.localeCompare(b.date));
        }

        function formatDate(dateString) {
            const [year, month, day] = dateString.split('-').map(Number);
            const date = new Date(year, month - 1, day);
            const weekday = new Intl.DateTimeFormat('zh-CN', { weekday: 'short' }).format(date);
            return `${dateString} · ${weekday}`;
        }

        function makeElement(tag, className, text) {
            const element = document.createElement(tag);
            if (className) element.className = className;
            if (text !== undefined) element.textContent = text;
            return element;
        }

        function renderParagraphs(container, paragraphs) {
            paragraphs.forEach((text) => container.appendChild(makeElement('p', '', text)));
        }

        function renderEntry(entry) {
            diaryContent.replaceChildren();
            const article = makeElement('article', 'entry');
            const bar = makeElement('div', 'entry-bar');
            bar.appendChild(makeElement('span', 'entry-filename', `${formatDate(entry.date)}${entry.weather ? ` · ${entry.weather}` : ''}`));
            if (entry.mood) bar.appendChild(makeElement('span', 'entry-status', entry.mood));
            article.appendChild(bar);

            const body = makeElement('div', 'entry-body');
            const content = makeElement('div', 'entry-content');
            const paragraphs = [
                entry.title,
                ...entry.content,
                ...(entry.note ? entry.note.split(/\n\s*\n/).map((part) => part.trim()).filter(Boolean) : [])
            ].filter(Boolean);
            renderParagraphs(content, paragraphs);
            if (!paragraphs.length) content.appendChild(makeElement('p', '', '这篇日记还没有正文。'));
            body.appendChild(content);

            if (entry.tags.length) {
                const tags = makeElement('ul', 'entry-tags');
                entry.tags.forEach((tag) => tags.appendChild(makeElement('li', 'entry-tag', tag)));
                body.appendChild(tags);
            }

            if (entry.image) {
                const image = makeElement('img', 'entry-image');
                image.src = entry.image;
                image.alt = `日记配图：${entry.title}`;
                image.addEventListener('error', () => image.remove(), { once: true });
                body.appendChild(image);
            }

            article.appendChild(body);
            diaryContent.appendChild(article);
        }

        function renderEmptyState(message) {
            diaryContent.replaceChildren(makeElement('p', 'empty-state', message));
        }

        function renderDateTabs() {
            dateTabs.replaceChildren();
            if (!diaryState.entries.length || !diaryState.currentDate) return;
            const activeIndex = diaryState.entries.findIndex((entry) => entry.date === diaryState.currentDate);
            const visibleCount = 7;
            const start = Math.max(0, Math.min(activeIndex - 3, diaryState.entries.length - visibleCount));
            diaryState.entries.slice(start, start + visibleCount).forEach((entry) => {
                const button = makeElement('button', 'date-tab');
                button.type = 'button';
                button.appendChild(makeElement('span', 'date-tab-day', entry.date));
                button.appendChild(makeElement('span', 'date-tab-mood', entry.mood || entry.title));
                button.classList.toggle('active', entry.date === diaryState.currentDate);
                button.setAttribute('aria-current', entry.date === diaryState.currentDate ? 'date' : 'false');
                button.addEventListener('click', () => showDate(entry.date));
                dateTabs.appendChild(button);
            });
            scrollActiveDateTab();
        }

        function scrollActiveDateTab() {
            const activeTab = dateTabs.querySelector('.date-tab.active');
            if (activeTab) {
                const containerBounds = dateTabs.getBoundingClientRect();
                const tabBounds = activeTab.getBoundingClientRect();
                dateTabs.scrollLeft += tabBounds.left - containerBounds.left - (containerBounds.width - tabBounds.width) / 2;
            }
        }

        window.addEventListener('resize', scrollActiveDateTab);

        function updateNavigation() {
            const index = diaryState.entries.findIndex((entry) => entry.date === diaryState.currentDate);
            document.getElementById('prev-diary').disabled = index <= 0;
            document.getElementById('next-diary').disabled = index < 0 || index >= diaryState.entries.length - 1;
            document.getElementById('diary-position').textContent = index < 0
                ? '' : `第 ${index + 1} 篇 / 共 ${diaryState.entries.length} 篇`;
        }

        function renderCollection(preferredDate) {
            sortEntries(diaryState.entries);
            if (diaryState.entries.length) {
                const date = diaryState.entries.some((entry) => entry.date === preferredDate)
                    ? preferredDate : diaryState.entries[diaryState.entries.length - 1].date;
                showDate(date, false);
                const url = new URL(window.location.href);
                url.hash = date;
                window.history.replaceState({ date }, '', url);
            } else {
                diaryState.currentDate = null;
                renderEmptyState('还没有日记。');
                renderDateTabs();
                updateNavigation();
                const url = new URL(window.location.href);
                url.hash = '';
                window.history.replaceState({}, '', url);
            }
        }

        function showDate(date, updateAddress = true) {
            if (!diaryState.entries.some((entry) => entry.date === date)) return;
            diaryState.currentDate = date;
            renderEntry(diaryState.entries.find((entry) => entry.date === date));
            renderDateTabs();
            updateNavigation();
            if (updateAddress && window.location.hash !== `#${date}`) {
                const url = new URL(window.location.href);
                url.hash = date;
                window.history.pushState({ date }, '', url);
            }
        }

        function navigateDiary(offset) {
            const index = diaryState.entries.findIndex((entry) => entry.date === diaryState.currentDate);
            const target = diaryState.entries[index + offset];
            if (target) showDate(target.date);
        }

        document.getElementById('prev-diary').addEventListener('click', () => navigateDiary(-1));
        document.getElementById('next-diary').addEventListener('click', () => navigateDiary(1));

        document.addEventListener('keydown', (event) => {
            trapCalendarFocus(event);
            if (event.key === 'Escape' && !calendarBackdrop.hidden) {
                closeCalendar();
                return;
            }
            const target = event.target;
            if (!calendarBackdrop.hidden || event.altKey || event.ctrlKey || event.metaKey ||
                target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement ||
                target instanceof HTMLSelectElement || target instanceof HTMLButtonElement ||
                target instanceof HTMLAnchorElement || target.isContentEditable) return;
            if (event.key === 'ArrowLeft' && !document.getElementById('prev-diary').disabled) {
                event.preventDefault();
                navigateDiary(-1);
            }
            if (event.key === 'ArrowRight' && !document.getElementById('next-diary').disabled) {
                event.preventDefault();
                navigateDiary(1);
            }
        });

        window.addEventListener('popstate', () => {
            const date = window.location.hash.slice(1);
            if (diaryState.entries.some((entry) => entry.date === date)) {
                showDate(date, false);
                return;
            }
            if (diaryState.entries.length) {
                const fallback = diaryState.entries[diaryState.entries.length - 1].date;
                showDate(fallback, false);
                const url = new URL(window.location.href);
                url.hash = fallback;
                window.history.replaceState({ date: fallback }, '', url);
            }
        });

        document.getElementById('home-image').addEventListener('error', (event) => {
            event.currentTarget.closest('.cover-wrap').hidden = true;
        }, { once: true });

        function validateStaticEntries(data) {
            const normalized = data.map(normalizeEntry).filter(Boolean);
            const byDate = new Map();
            const duplicates = new Set();
            normalized.forEach((entry) => {
                if (byDate.has(entry.date)) duplicates.add(entry.date);
                byDate.set(entry.date, entry);
            });
            if (duplicates.size) {
                console.warn(`diary.json 存在重复日期，已保留最后一条：${[...duplicates].join('、')}`);
            }
            return sortEntries([...byDate.values()]);
        }

        async function loadDiaries() {
            let staticError = false;
            try {
                const response = await fetch('./diary.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('根节点必须是日记数组');
                diaryState.entries = validateStaticEntries(data);
                if (data.length !== diaryState.entries.length) {
                    console.warn('Some invalid or duplicate diary entries were skipped.');
                }
            } catch (error) {
                staticError = true;
                diaryState.entries = [];
                console.error('Diary data could not be loaded:', error);
            }

            const firstDate = window.location.hash.slice(1);
            if (diaryState.entries.length) {
                const initialDate = diaryState.entries.some((entry) => entry.date === firstDate)
                    ? firstDate : diaryState.entries[diaryState.entries.length - 1].date;
                renderCollection(initialDate);
            } else {
                renderEmptyState(staticError
                    ? '暂时无法读取 diary.json。请确认文件存在、JSON 格式正确，并通过本地静态服务器打开本页。'
                    : '还没有日记。');
                renderDateTabs();
                updateNavigation();
            }
        }

        loadDiaries();
    </script>
</body>
</html>
